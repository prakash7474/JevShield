name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede an in-flight run when a branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor required by p-retry@8; 24 is the current LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke-test the built entry
        run: node --input-type=module -e "await import('./dist/index.js')"

  studio:
    name: studio (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run studio:typecheck

      - name: Test
        run: npm run studio:test

      # Runs `tsc --noEmit && vite build`, so the typecheck above is a
      # deliberate early-exit and this step is the production bundle.
      - name: Build
        run: npm run studio:build
