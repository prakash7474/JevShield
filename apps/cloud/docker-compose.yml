version: "3.8"

services:
  gateway:
    build:
      context: ../..
      dockerfile: apps/cloud/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://jevshield:secret_password@postgres:5432/jevshield_db?schema=public
      - REDIS_URL=redis://redis:6379
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - HITL_CONFIDENCE_THRESHOLD=0.70
      - RATE_LIMIT_MAX=1000
      - RATE_LIMIT_WINDOW_SECONDS=60
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jevshield
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: jevshield_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/schema.prisma:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jevshield -d jevshield_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      - gateway
    restart: always

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafdata:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always

volumes:
  pgdata:
  redisdata:
  promdata:
  grafdata:
