[package]
name = "jevshield-studio"
version = "0.2.0"
description = "JevShield Studio — a visual IDE and debugger for Jev decision pipelines"
authors = ["JevShield"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a name collision with the binary on Windows.
name = "jevshield_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Used by `tauri build` so the frontend is served from the ASAR-like bundle
# instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
